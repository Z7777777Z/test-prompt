<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Prompt · 模型列表</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e8eaee; --line-soft:#f0f2f5;
    --text:#1f2329; --text-2:#5b6371; --text-3:#9aa1ad;
    --brand:#2c6bed; --brand-soft:#eef4ff;
    --danger:#e5484d; --danger-soft:#fdf0f0; --radius:8px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .app{display:flex;min-height:100vh}

  /* ---------- 左侧菜单 ---------- */
  .sidebar{
    width:236px; flex:0 0 236px; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    display:flex; align-items:center; gap:10px; height:60px; padding:0 18px;
    border-bottom:1px solid var(--line);
  }
  .brand-logo{
    width:28px; height:28px; border-radius:7px; flex:0 0 auto; color:#fff;
    background:linear-gradient(135deg,#2c6bed,#5b9bff);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-name{font-size:15px; font-weight:600; letter-spacing:.2px}

  .menu{padding:10px 8px; overflow:auto; flex:1}
  .menu ul{list-style:none; margin:0; padding:0}
  .item{
    display:flex; align-items:center; gap:6px; width:100%;
    padding:8px 10px; border:0; border-radius:6px; background:transparent;
    color:var(--text-2); font:inherit; text-align:left; cursor:pointer;
  }
  .item:hover{background:#f4f5f8; color:var(--text)}
  .item .caret{
    width:14px; flex:0 0 14px; color:var(--text-3); font-size:10px;
    text-align:center; transition:transform .15s ease;
  }
  .group.open > .item .caret{transform:rotate(90deg)}
  .group.leaf > .item .caret{visibility:hidden}
  .item .label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lv1{font-size:14px; font-weight:600; color:var(--text)}
  .lv2{margin-left:8px; font-size:13.5px}
  .lv3{margin-left:22px; font-size:13px; color:var(--text-3); padding:6px 10px}
  .lv3 .dot{width:4px; height:4px; border-radius:50%; background:#cdd2db; flex:0 0 4px}
  .lv3:hover .dot, .lv3.active .dot{background:var(--brand)}
  .item.active{background:var(--brand-soft); color:var(--brand)}
  .menu a.item{text-decoration:none}
  .sub{display:none}
  .group.open > .sub{display:block}
  .sidebar-foot{padding:12px 18px; border-top:1px solid var(--line); color:var(--text-3); font-size:12px}

  /* ---------- 主区 ---------- */
  .main{flex:1; min-width:0; padding:20px 24px 40px}
  .page-head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px}
  .crumb{color:var(--text-3); font-size:13px}
  .crumb b{color:var(--text); font-weight:600; font-size:15px}
  .actions{display:flex; gap:8px}

  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    height:32px; padding:0 14px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel);
    color:var(--text); font:inherit; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:#fafbfc; border-color:#d9dde3}
  a.btn, a.btn:hover{text-decoration:none}
  .btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn-primary:hover{background:#255ed6; border-color:#255ed6}
  .btn-danger{color:var(--danger); border-color:#f2c9cb}
  .btn-danger:hover:not(:disabled){background:var(--danger-soft); border-color:#ecb4b6}
  .btn:disabled{color:#c3c8d1; border-color:var(--line); background:#fafbfc; cursor:not-allowed}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}

  .searchbar{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px;
    padding:16px 18px; border-bottom:1px solid var(--line-soft);
  }
  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:13px; color:var(--text-2)}
  .field input{
    width:210px; height:32px; padding:0 10px; outline:none;
    border:1px solid var(--line); border-radius:6px; background:var(--panel);
    color:var(--text); font:inherit;
  }
  .field input::placeholder{color:var(--text-3)}
  .field input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(44,107,237,.12)}
  .search-actions{display:flex; gap:8px; margin-left:auto}

  /* ---------- 可编辑下拉列表框 ---------- */
  .combo{position:relative}
  .combo > input{padding-right:32px}
  .combo-arrow{
    position:absolute; right:1px; top:1px; width:28px; height:30px;
    border:0; background:transparent; color:var(--text-3);
    font-size:10px; line-height:1; cursor:pointer; border-radius:6px;
  }
  .combo-arrow:hover{color:var(--text-2)}
  .combo.open > input{border-color:var(--brand); box-shadow:0 0 0 3px rgba(44,107,237,.12)}
  .combo-list{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20;
    padding:4px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; box-shadow:0 8px 24px rgba(15,20,30,.10);
    max-height:216px; overflow:auto;
  }
  .combo-list[hidden]{display:none}
  .combo-option{padding:7px 10px; border-radius:6px; font-size:13.5px; color:var(--text); cursor:pointer}
  .combo-option:hover, .combo-option.active{background:var(--brand-soft); color:var(--brand)}
  .combo-empty{padding:8px 10px; color:var(--text-3); font-size:12.5px}

  /* ---------- 区间输入 ---------- */
  .range{display:flex; align-items:center; gap:6px}
  .range input{width:88px}
  .range .sep{color:var(--text-3)}

  /* ---------- 表格 ---------- */
  .table-wrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:860px}
  th,td{padding:12px 18px; text-align:left; font-weight:400; border-bottom:1px solid var(--line-soft)}
  thead th{
    color:var(--text-2); font-size:13px; font-weight:600;
    background:#fbfcfd; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody tr:hover{background:#fafbfd}
  tbody tr.selected{background:var(--brand-soft)}
  tbody tr:last-child td{border-bottom:0}
  .col-check{width:44px; padding-right:0}
  .col-check input{width:15px; height:15px; vertical-align:-2px; accent-color:var(--brand); cursor:pointer}
  .col-num{color:var(--text-2); font-variant-numeric:tabular-nums; white-space:nowrap}
  .col-unit{color:var(--text-3); font-size:12.5px; margin-left:4px}
  .col-type{color:var(--text-2)}
  .empty{padding:48px 0; text-align:center; color:var(--text-3)}
  .table-foot{
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px;
    padding:12px 18px; background:#fbfcfd; color:var(--text-3); font-size:13px;
  }

  /* ---------- 弹窗 / 轻提示 ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50; padding:24px;
    background:rgba(15,20,30,.35);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay[hidden]{display:none}
  .dialog{
    width:100%; max-width:400px; padding:20px 22px; background:var(--panel);
    border-radius:10px; box-shadow:0 12px 32px rgba(15,20,30,.18);
  }
  .dialog h3{margin:0 0 8px; font-size:16px}
  .dialog p{margin:0; color:var(--text-2)}
  .dialog-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:18px}
  .toast{
    position:fixed; left:50%; bottom:36px; z-index:60; transform:translateX(-50%);
    padding:9px 16px; border-radius:6px; background:#1f2329; color:#fff; font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
  }
  .toast[hidden]{display:none}
</style>
</head>
<body>

            </li>
            <!-- 二级菜单：模型 -->

              </ul>
            </li>

        </li>

        </li>
      </ul>
    </nav>

    <div class="sidebar-foot">v0.1 · 原型演示</div>

  <!-- ================= 主内容 ================= -->
  <main class="main">
    <div class="page-head">
      <div class="crumb">基础信息 / 模型 / <b>模型列表</b></div>
      <div class="actions">
        <button class="btn btn-danger" id="btnDelete" type="button" disabled>删除</button>
        <a class="btn btn-primary" id="btnAdd" href="model_add.html" data-page="添加模型">添加</a>
      </div>
    </div>

    <section class="card">
      <!-- 搜索区 -->
      <form class="searchbar" id="searchForm">
        <div class="field">
          <label for="platform">平台/官方名</label>
          <div class="combo" id="combo-platform">
            <input id="platform" type="text" autocomplete="off" role="combobox" aria-expanded="false"
                   aria-autocomplete="list" aria-controls="platformList" placeholder="选择或输入平台">
            <button class="combo-arrow" type="button" id="platformArrow" aria-label="展开平台选项">&#9660;</button>
            <div class="combo-list" id="platformList" role="listbox" hidden></div>
          </div>
        </div>

        <div class="field">
          <label for="modelName">模型名</label>
          <input id="modelName" type="text" placeholder="请输入模型名" autocomplete="off">
        </div>

        <div class="field">
          <label for="type">类型</label>
          <div class="combo" id="combo-type">
            <input id="type" type="text" autocomplete="off" role="combobox" aria-expanded="false"
                   aria-autocomplete="list" aria-controls="typeList" placeholder="选择或输入类型">
            <button class="combo-arrow" type="button" id="typeArrow" aria-label="展开类型选项">&#9660;</button>
            <div class="combo-list" id="typeList" role="listbox" hidden></div>
          </div>
        </div>

        <div class="field">
          <label for="inMin">输入token计费</label>
          <div class="range">
            <input id="inMin" type="text" inputmode="decimal" placeholder="最小值" autocomplete="off">
            <span class="sep">~</span>
            <input id="inMax" type="text" inputmode="decimal" placeholder="最大值" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="outMin">输出token计费</label>
          <div class="range">
            <input id="outMin" type="text" inputmode="decimal" placeholder="最小值" autocomplete="off">
            <span class="sep">~</span>
            <input id="outMax" type="text" inputmode="decimal" placeholder="最大值" autocomplete="off">
          </div>
        </div>

        <div class="search-actions">
          <button class="btn btn-primary" type="submit">搜索</button>
          <button class="btn" type="button" id="btnReset">重置</button>
        </div>
      </form>

      <!-- 列表 -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="checkAll" aria-label="全选"></th>
              <th>平台/官方名</th>
              <th>模型名</th>
              <th>类型</th>
              <th>输入token计费</th>
              <th>输出token计费</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="table-foot">
        <span id="count"></span>
      </div>
    </section>
  </main>
</div>

    return String(value).replace(/[&<>"]/g, function (c) { return ESC_MAP[c]; });
  }

  /* ---------- 可编辑下拉列表框 ---------- */
  function setupCombo(comboId, input, arrow, list, options) {
    var combo = document.getElementById(comboId);
    var activeIndex = -1;

    function items() {
      return Array.prototype.slice.call(list.querySelectorAll('.combo-option'));
    }

    function renderList() {
      var key = input.value.trim().toLowerCase();
      list.innerHTML = '';
      options.forEach(function (name) {
        if (key && name.toLowerCase().indexOf(key) === -1) return;
        var opt = document.createElement('div');
        opt.className = 'combo-option' + (name.toLowerCase() === key ? ' active' : '');
        opt.setAttribute('role', 'option');
        opt.setAttribute('data-value', name);
        opt.textContent = name;
        list.appendChild(opt);
      });
      if (!list.children.length) {
        var empty = document.createElement('div');
        empty.className = 'combo-empty';
        empty.textContent = '无匹配选项，可直接输入自定义内容';
        list.appendChild(empty);
      }
      activeIndex = -1;
    }

    function openList() {
      renderList();
      list.hidden = false;
      combo.classList.add('open');
      input.setAttribute('aria-expanded', 'true');
    }

    function closeList() {
      list.hidden = true;
      combo.classList.remove('open');
      input.setAttribute('aria-expanded', 'false');
      activeIndex = -1;
    }

    function highlight(index) {
      var opts = items();
      opts.forEach(function (el) { el.classList.remove('active'); });
      if (index < 0 || index >= opts.length) { activeIndex = -1; return; }
      activeIndex = index;
      opts[index].classList.add('active');
      if (opts[index].scrollIntoView) opts[index].scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('focus', openList);
    input.addEventListener('input', function () { if (list.hidden) openList(); else renderList(); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (list.hidden) { openList(); return; }
        highlight(Math.min(activeIndex + 1, items().length - 1));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlight(Math.max(activeIndex - 1, 0));
      } else if (e.key === 'Enter') {
        var opts = items();
        if (!list.hidden && activeIndex > -1 && opts[activeIndex]) {
          e.preventDefault();
          input.value = opts[activeIndex].getAttribute('data-value');
          closeList();
        }
      } else if (e.key === 'Escape') {
        closeList();
      }
    });
    input.addEventListener('blur', function () { setTimeout(closeList, 120); });

    arrow.addEventListener('click', function () {
      if (list.hidden) { openList(); input.focus(); } else { closeList(); }
    });

    list.addEventListener('mousedown', function (e) {
      var opt = e.target.closest('.combo-option');
      if (!opt) return;
      e.preventDefault();
      input.value = opt.getAttribute('data-value');
      closeList();
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('#' + comboId)) closeList();
    });

    return { close: closeList };
  }

  var platformCombo = setupCombo('combo-platform', platformIn, document.getElementById('platformArrow'),
                                 document.getElementById('platformList'), PLATFORMS);
  var typeCombo     = setupCombo('combo-type', typeIn, document.getElementById('typeArrow'),
                                 document.getElementById('typeList'), TYPES);

  /* ---------- 筛选 ---------- */
  function num(value) {
    var text = String(value).trim();
    if (!text) return null;
    var n = Number(text);
    return isNaN(n) ? null : n;
  }

  function filters() {
    return {
      platform: platformIn.value.trim().toLowerCase(),
      model:    modelNameIn.value.trim().toLowerCase(),
      type:     typeIn.value.trim().toLowerCase(),
      inMin:    num(inMinIn.value),
      inMax:    num(inMaxIn.value),
      outMin:   num(outMinIn.value),
      outMax:   num(outMaxIn.value)
    };
  }

  function hasFilter(f) {
    return !!(f.platform || f.model || f.type ||
      f.inMin !== null || f.inMax !== null || f.outMin !== null || f.outMax !== null);
  }

  function visibleRows() {
    var f = filters();
    return models.filter(function (m) {
      if (f.platform && m.platform.toLowerCase().indexOf(f.platform) === -1) return false;
      if (f.model && m.model.toLowerCase().indexOf(f.model) === -1) return false;
      if (f.type && m.type.toLowerCase().indexOf(f.type) === -1) return false;
      if (f.inMin !== null && m.inPrice < f.inMin) return false;
      if (f.inMax !== null && m.inPrice > f.inMax) return false;
      if (f.outMin !== null && m.outPrice < f.outMin) return false;
      if (f.outMax !== null && m.outPrice > f.outMax) return false;
      return true;
    });
  }

  /* ---------- 渲染 ---------- */
  function money(value) {
    return Number(value).toFixed(2);
  }

  function render() {
    var rows = visibleRows();

    if (!rows.length) {
      tbody.innerHTML = '<tr><td class="empty" colspan="6">没有符合条件的模型</td></tr>';
    } else {
      tbody.innerHTML = rows.map(function (m) {
        return '<tr data-id="' + m.id + '"' + (selected[m.id] ? ' class="selected"' : '') + '>' +
          '<td class="col-check">' +
            '<input type="checkbox" data-check aria-label="选择 ' + esc(m.model) + '"' + (selected[m.id] ? ' checked' : '') + '>' +
          '</td>' +
          '<td><a href="#" data-detail="平台详情：' + esc(m.platform) + '">' + esc(m.platform) + '</a></td>' +
          '<td><a href="#" data-detail="模型详情：' + esc(m.model) + '">' + esc(m.model) + '</a></td>' +
          '<td class="col-type">' + esc(m.type) + '</td>' +
          '<td class="col-num">' + money(m.inPrice) + '<span class="col-unit">元/' + esc(m.inUnit) + '</span></td>' +
          '<td class="col-num">' + money(m.outPrice) + '<span class="col-unit">元/' + esc(m.outUnit) + '</span></td>' +
        '</tr>';
      }).join('');
    }

    countEl.textContent = '共 ' + rows.length + ' 条' + (hasFilter(filters()) ? '，已按条件筛选' : '');
    syncSelection();
  }

  /* ---------- 勾选状态 ---------- */
  function syncSelection() {
    var boxes = tbody.querySelectorAll('input[data-check]');
    var checked = 0;
    Array.prototype.forEach.call(boxes, function (b) { if (b.checked) checked++; });

    checkAll.checked = boxes.length > 0 && checked === boxes.length;
    checkAll.indeterminate = checked > 0 && checked < boxes.length;
    btnDel.disabled = checked === 0;
  }

  function selectedRows() {
    return models.filter(function (m) { return selected[m.id]; });
  }

  /* ---------- 轻提示 ---------- */
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 1800);
  }

  /* ---------- 搜索 / 重置 ---------- */
  document.getElementById('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    platformCombo.close();
    typeCombo.close();
    render();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    platformIn.value = '';
    modelNameIn.value = '';
    typeIn.value = '';
    inMinIn.value = '';
    inMaxIn.value = '';
    outMinIn.value = '';
    outMaxIn.value = '';
    platformCombo.close();
    typeCombo.close();
    render();
    modelNameIn.focus();
  });

  /* ---------- 全选 ---------- */
  checkAll.addEventListener('change', function () {
    visibleRows().forEach(function (m) {
      if (checkAll.checked) selected[m.id] = true; else delete selected[m.id];
    });
    render();
  });

  /* ---------- 行交互 ---------- */
  tbody.addEventListener('click', function (e) {
    var link = e.target.closest('a[data-detail]');
    if (link) {
      e.preventDefault();
      toast('打开「' + link.getAttribute('data-detail') + '」（原型示意）');
      return;
    }

    var tr = e.target.closest('tr[data-id]');
    if (!tr) return;

    var id = tr.getAttribute('data-id');
    var box = tr.querySelector('input[data-check]');
    if (e.target !== box) box.checked = !box.checked;

    if (box.checked) selected[id] = true; else delete selected[id];
    tr.classList.toggle('selected', box.checked);
    syncSelection();
  });

  /* ---------- 添加（直接跳转 model_add.html，见按钮 href） ---------- */

  /* ---------- 删除 ---------- */
  btnDel.addEventListener('click', function () {
    if (btnDel.disabled) return;
    var rows = selectedRows();
    var names = rows.map(function (m) { return m.model; });
    dlgText.textContent = '确定要删除选中的 ' + names.length + ' 个模型吗？（' +
      names.slice(0, 3).join('、') + (names.length > 3 ? ' 等' : '') + '）删除后不可恢复。';
    overlay.hidden = false;
  });

  document.getElementById('dlgCancel').addEventListener('click', function () {
    overlay.hidden = true;
  });

  document.getElementById('dlgOk').addEventListener('click', function () {
    var count = selectedRows().length;
    models = models.filter(function (m) { return !selected[m.id]; });
    selected = {};
    overlay.hidden = true;
    render();
    toast('已删除 ' + count + ' 个模型');
  });

  overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') overlay.hidden = true; });

  /* ---------- 左侧菜单 ---------- */
  document.getElementById('menu').addEventListener('click', function (e) {
    var btn = e.target.closest('button.item');
    if (!btn) return;

    var items = document.querySelectorAll('.item');

    if (btn.hasAttribute('data-toggle')) {
      btn.parentElement.classList.toggle('open');
      return;
    }

    Array.prototype.forEach.call(items, function (b) { b.classList.remove('active'); });
    btn.classList.add('active');

    if (btn.classList.contains('lv1')) {
      if (btn.parentElement.classList.contains('leaf')) {
        toast('切换到「' + btn.getAttribute('data-page') + '」（原型示意）');
      } else {
        btn.parentElement.classList.add('open');
      }
      return;
    }

    toast('切换到「' + btn.getAttribute('data-page') + '」（原型示意）');
  });

  render();
})();
</script>
</body>
